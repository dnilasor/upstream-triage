[project]
name = "upstream-triage"
version = "0.1.0"
description = "Is it us, or is it upstream? An incident-triage agent on Claude, MCP and public internet data, traced with OpenTelemetry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Lower bounds are the versions this was last tested against (Nov 2026). The two SDKs are capped
# at their next major release, since both have shipped breaking changes at majors before.
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.16",                  # successor to httpx; what mcp and anthropic depend on
    "anthropic>=2.13,<3",
    "starlette>=1.10",
    "uvicorn>=0.54",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
upstream = "upstream.cli:main"
upstream-signals = "upstream.server:main"
upstream-web = "upstream.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upstream"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
