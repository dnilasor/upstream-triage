[project]
name = "upstream-triage"
version = "0.1.0"
description = "Is it us, or is it upstream? An incident-triage agent on Claude, MCP and public internet data, traced with OpenTelemetry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2",
    "anthropic",
    "starlette",
    "uvicorn",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
upstream = "upstream.cli:main"
upstream-signals = "upstream.server:main"
upstream-web = "upstream.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upstream"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
