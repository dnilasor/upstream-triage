services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ..:/workspaces/upstream-triage:cached
    command: sleep infinity
    # Share Jaeger's network, so Jaeger is reachable at localhost from the app container
    # and Codespaces can forward its UI port like any local port.
    network_mode: service:jaeger
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      HOST: 0.0.0.0
    depends_on:
      - jaeger

  jaeger:
    # All-in-one Jaeger v2: OTLP in on 4317/4318, UI on 16686, in-memory storage.
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped